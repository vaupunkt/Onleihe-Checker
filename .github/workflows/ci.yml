name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      full_smoke:
        description: 'Run the API smoke test across every consortium instead of a sample'
        type: boolean
        default: false
  schedule:
    # Check against the real Onleihe API weekly. Fires if the API changes again.
    - cron: '17 5 * * 1'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build

      - name: Tests
        run: npm test

      - name: Check Firefox
        run: npx web-ext lint --source-dir dist/firefox

      - name: Upload Artefacts
        uses: actions/upload-artifact@v4
        with:
          name: extension-packages
          path: |
            dist/*.zip
            dist/*.xpi

  api-smoke:
    # Exercises the Onleihe API itself and therefore depends on its availability -
    # skipped for pull requests so it cannot block them.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # A sample by default: an API change is global, so 15 consortia detect it as
      # reliably as 123 while making a fraction of the requests against someone
      # else's service. Full coverage on demand via workflow_dispatch.
      - name: Check Onleihe API
        run: |
          if [ "${{ inputs.full_smoke }}" = "true" ]; then
            python tools/smoke_api.py
          else
            python tools/smoke_api.py --sample 15
          fi
